<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LocalBox Demo Video</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            padding: 24px 16px 40px;
            font-family: Arial, Helvetica, sans-serif;
            color: #20242a;
            background: #f7f8f5;
        }
        main {
            width: min(100%, 960px);
            margin: 0 auto;
        }
        a { color: #1e6f5c; }
        h1 { margin: 0 0 8px; font-size: clamp(28px, 6vw, 44px); }
        p { margin: 0 0 22px; color: #5d6660; }
        .video-frame {
            width: 100%;
            aspect-ratio: 240 / 131;
            background: #101513;
            border-radius: 8px;
            overflow: hidden;
        }
        video {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .back { display: inline-block; margin-top: 22px; }
    </style>
</head>
<body>
    <main>
        <h1>LocalBox demo</h1>
        <p>Watch the LocalBox demonstration video.</p>
        <div class="video-frame">
            <video controls playsinline preload="metadata">
                <source src="/assets/recording-annotated.mp4?v=20260821" type="video/mp4">
                Your browser does not support MP4 video.
            </video>
        </div>
        <a class="back" href="/">Back to LocalBox</a>
    </main>
</body>
</html>
