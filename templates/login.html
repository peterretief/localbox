<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>LocalBox Mail — Login</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: sans-serif; background: #1a1a2e; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card { background: white; padding: 40px; border-radius: 8px; width: 100%; max-width: 400px; }
        h1 { color: #1a1a2e; margin-bottom: 8px; font-size: 1.5em; }
        p.sub { color: #999; margin-bottom: 30px; font-size: 0.9em; }
        label { display: block; color: #555; font-size: 0.85em; margin-bottom: 4px; margin-top: 16px; }
        input, select { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 4px; font-size: 1em; background: white; }
        input:focus, select:focus { outline: none; border-color: #00b4d8; }
        button { width: 100%; margin-top: 24px; padding: 12px; background: #00b4d8; color: white; border: none; border-radius: 4px; font-size: 1em; cursor: pointer; }
        button:hover { background: #0096c7; }
        .error { color: #e63946; margin-top: 16px; font-size: 0.9em; text-align: center; }
    </style>
</head>
<body>
    <div class="card">
        <h1>📬 LocalBox Mail</h1>
        <p class="sub">Sign in to your mailbox</p>
        <form method="POST" action="/login">

            <label>Username</label>
<input type="text" name="username" placeholder="peter" value="{{.Username}}" required autofocus>
            <label>Domain</label>
            {{if .Domains}}
            <select name="domain" required>
                {{range .Domains}}
                <option value="{{.}}" {{if eq . $.Domain}}selected{{end}}>{{.}}</option>
                {{end}}
            </select>
            {{else}}
            <input type="text" name="domain" placeholder="opamp.co.za" value="{{.Domain}}" required>
            {{end}}
            <label>Password</label>
            <input type="password" name="password" required>
            <button type="submit">Sign in</button>
        </form>
        {{if .Error}}<p class="error">{{.Error}}</p>{{end}}
    </div>
</body>
</html>
