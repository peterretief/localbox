<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>LocalBox Mail — Set password</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: sans-serif; background: #1a1a2e; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card { background: white; padding: 40px; border-radius: 8px; width: 100%; max-width: 420px; }
        h1 { color: #1a1a2e; margin-bottom: 8px; font-size: 1.5em; }
        p.sub { color: #777; margin-bottom: 30px; font-size: 0.9em; line-height: 1.45; }
        label { display: block; color: #555; font-size: 0.85em; margin-bottom: 4px; margin-top: 16px; }
        input { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 4px; font-size: 1em; background: white; }
        input:focus { outline: none; border-color: #00b4d8; }
        button { width: 100%; margin-top: 24px; padding: 12px; background: #00b4d8; color: white; border: none; border-radius: 4px; font-size: 1em; cursor: pointer; }
        button:hover { background: #0096c7; }
        .error { color: #e63946; margin-top: 16px; font-size: 0.9em; text-align: center; }
        .notice { color: #2a9d4b; margin-top: 16px; font-size: 0.9em; text-align: center; }
        .link { margin-top: 18px; color: #777; font-size: 0.9em; text-align: center; }
        .link a { color: #00a0c0; text-decoration: none; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Set new password</h1>
        <p class="sub">Choose a new password for your LocalBox account.</p>
        {{if .Success}}
            <p class="notice">{{.Success}}</p>
            <p class="link"><a href="/login">Sign in</a></p>
        {{else}}
            <form method="POST" action="/reset-password">
                <input type="hidden" name="token" value="{{.Token}}">
                <label>New password</label>
                <input type="password" name="password" required minlength="8" autofocus>
                <label>Confirm password</label>
                <input type="password" name="confirm_password" required minlength="8">
                <button type="submit">Update password</button>
            </form>
            {{if .Error}}<p class="error">{{.Error}}</p>{{end}}
            <p class="link"><a href="/forgot-password">Request a new link</a></p>
        {{end}}
    </div>
</body>
</html>
