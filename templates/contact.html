<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: sans-serif; background: #f5f5f5; }
        nav { background: #1a1a2e; padding: 0 40px; height: 60px; display: flex; align-items: center; }
        nav a { color: white; text-decoration: none; font-size: 1.1em; font-weight: bold; }
        .content { max-width: 600px; margin: 60px auto; padding: 0 20px; }
        h1 { color: #1a1a2e; margin-bottom: 8px; }
        p.sub { color: #777; margin-bottom: 32px; }
        .card { background: white; padding: 32px; border-radius: 8px; }
        label { display: block; color: #555; font-size: 0.85em; margin-bottom: 4px; margin-top: 16px; }
        input, textarea { width: 100%; padding: 10px 14px; border: 1px solid #ddd; border-radius: 4px; font-size: 1em; font-family: sans-serif; }
        input:focus, textarea:focus { outline: none; border-color: #00b4d8; }
        textarea { height: 150px; resize: vertical; }
        button { margin-top: 24px; background: #00b4d8; color: white; border: none; padding: 12px 32px; border-radius: 4px; font-size: 1em; cursor: pointer; width: 100%; }
        button:hover { background: #0096c7; }
        footer { text-align: center; padding: 40px; color: #777; font-size: 0.85em; }
    </style>
</head>
<body>
    <nav><a href="/">Back</a></nav>
    <div class="content">
        <h1>Contact Us</h1>
        <p class="sub">Send us a message and we will get back to you shortly.</p>
        <div class="card">
            <form method="POST" action="/contact">
                <input type="text" name="website" autocomplete="off" tabindex="-1" style="position:absolute;left:-10000px;top:auto;width:1px;height:1px;overflow:hidden;" aria-hidden="true">
                <label for="name">Your Name</label>
                <input id="name" type="text" name="name" placeholder="John Smith" required>
                <label for="email">Email Address</label>
                <input id="email" type="email" name="email" placeholder="john@example.com" required>
                <label for="subject">Subject</label>
                <input id="subject" type="text" name="subject" placeholder="How can we help?">
                <label for="message">Message</label>
                <textarea id="message" name="message" placeholder="Your message..." required></textarea>
                <button type="submit">Send Message</button>
            </form>
        </div>
    </div>
    <footer>Powered by <a href="https://diode.co.za" style="color:#00b4d8;">LocalBox</a></footer>
</body>
</html>
