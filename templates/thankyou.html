<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Message Sent</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: sans-serif; background: #f5f5f5; color: #1a1a2e; }
        nav { background: #1a1a2e; padding: 0 40px; height: 60px; display: flex; align-items: center; }
        nav a { color: white; text-decoration: none; font-size: 1.1em; font-weight: bold; }
        .content { max-width: 600px; margin: 60px auto; padding: 0 20px; }
        .card { background: white; padding: 32px; border-radius: 8px; }
        h1 { margin-bottom: 12px; }
        p { color: #555; line-height: 1.5; }
        .actions { margin-top: 24px; }
        .actions a { color: #00b4d8; font-weight: bold; text-decoration: none; }
    </style>
</head>
<body>
    <nav><a href="/">Back</a></nav>
    <div class="content">
        <div class="card">
            <h1>Message sent</h1>
            <p>Thanks for getting in touch. We will get back to you shortly.</p>
            <p class="actions"><a href="/">Return home</a></p>
        </div>
    </div>
</body>
</html>
