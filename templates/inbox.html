<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>LocalBox Mail</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; background: #f5f5f5; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        h1 { color: #1a1a2e; }
        .user { color: #999; font-size: 0.9em; }
        .logout { color: #e63946; font-size: 0.85em; text-decoration: none; }
        .message { background: white; padding: 15px 20px; margin: 8px 0; border-radius: 6px; cursor: pointer; border-left: 4px solid #ccc; }
        .message.new { border-left-color: #00b4d8; font-weight: bold; }
        .message:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .from { color: #333; }
        .subject { color: #1a1a2e; }
        .date { color: #999; font-size: 0.85em; float: right; }
        a { text-decoration: none; color: inherit; }
        .empty { color: #999; text-align: center; padding: 40px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>📬 LocalBox Mail</h1>
        <div>
            <span class="user">{{.User}}@{{.Domain}}</span>
            &nbsp;·&nbsp;
            <a class="logout" href="/logout">Sign out</a>
        </div>
    </div>
    {{if .Messages}}
        {{range .Messages}}
        <a href="/message?id={{.ID}}">
            <div class="message {{if .IsNew}}new{{end}}">
                <span class="date">{{.Date}}</span>
                <div class="from">{{.From}}</div>
                <div class="subject">{{.Subject}}</div>
            </div>
        </a>
        {{end}}
    {{else}}
        <div class="empty">No messages yet.</div>
    {{end}}
</body>
</html>
