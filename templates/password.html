<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Change Password</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: sans-serif; background: #f5f5f5; min-height: 100vh; margin: 0; display: flex; flex-direction: column; align-items: stretch; }
        .localbox-session-bar { flex: 0 0 auto; }
        .page { flex: 1 1 auto; width: 100%; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .card { background: white; padding: 34px; border-radius: 8px; width: 100%; max-width: 420px; }
        .back { color: #00a0c0; display: inline-block; margin-bottom: 22px; text-decoration: none; }
        h1 { color: #1a1a2e; margin-bottom: 22px; font-size: 1.45em; }
        label { display: block; color: #555; font-size: 0.85em; margin-bottom: 4px; margin-top: 16px; }
        input { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 4px; font-size: 1em; }
        input:focus { outline: none; border-color: #00b4d8; }
        button { width: 100%; margin-top: 24px; padding: 12px; background: #00b4d8; color: white; border: none; border-radius: 4px; font-size: 1em; cursor: pointer; }
        button:hover { background: #0096c7; }
        .error { color: #e63946; margin-top: 16px; font-size: 0.9em; text-align: center; }
        .success { color: #2a9d4b; margin-top: 16px; font-size: 0.9em; text-align: center; }
    </style>
</head>
<body>
    <main class="page">
        <div class="card">
            <a class="back" href="/apps/mail">Back to mail</a>
            <h1>Change Password</h1>
            <form method="POST" action="/password">
                <label for="current_password">Current password</label>
                <input id="current_password" type="password" name="current_password" required autofocus>

                <label for="new_password">New password</label>
                <input id="new_password" type="password" name="new_password" required minlength="8">

                <label for="confirm_password">Confirm new password</label>
                <input id="confirm_password" type="password" name="confirm_password" required minlength="8">

                <button type="submit">Update password</button>
            </form>
            {{if .Error}}<p class="error">{{.Error}}</p>{{end}}
            {{if .Success}}<p class="success">{{.Success}}</p>{{end}}
        </div>
    </main>
</body>
</html>
